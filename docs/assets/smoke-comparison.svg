<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
<title>A small, measured selection example</title>
<rect width="960" height="420" rx="20" fill="#101827"/>
<g font-family="Arial, sans-serif" fill="#f1f5f9">
<text x="36" y="50" font-size="26" font-weight="700">A small, measured selection example</text>
<text x="36" y="82" font-size="16" fill="#b9c6d8">Four synthetic candidates / two tasks / saved local smoke run</text>
<text x="36" y="139" font-size="16">Without selection</text>
<rect x="265" y="116" width="480.00" height="34" rx="5" fill="#94a3b8"/>
<text x="760.00" y="139" font-size="16">222 chars</text>
<text x="36" y="203" font-size="16">Recommended payload</text>
<rect x="265" y="180" width="276.76" height="34" rx="5" fill="#34d399"/>
<text x="556.76" y="203" font-size="16">128 chars</text>
<text x="36" y="365" font-size="15" fill="#b9c6d8">42.3% less candidate text if applied. Relevant items retained: 2/2. Mandatory: 1/1.</text>
<text x="36" y="391" font-size="15" fill="#b9c6d8">Advisory result. Not a production benchmark or measured provider-token saving.</text>
</g></svg>
