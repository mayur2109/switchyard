<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
<title>What context reduction could mean</title>
<rect width="960" height="420" rx="20" fill="#101827"/>
<g font-family="Arial, sans-serif" fill="#f1f5f9">
<text x="36" y="50" font-size="26" font-weight="700">What context reduction could mean</text>
<text x="36" y="82" font-size="16" fill="#b9c6d8">Illustrative only: 10,000 input tokens = 2,000 fixed + 8,000 candidate tokens</text>
<text x="36" y="139" font-size="16">No filtering</text>
<rect x="265" y="116" width="480.00" height="34" rx="5" fill="#94a3b8"/>
<text x="760.00" y="139" font-size="16">10,000</text>
<text x="36" y="203" font-size="16">25% candidates removed</text>
<rect x="265" y="180" width="384.00" height="34" rx="5" fill="#93c5fd"/>
<text x="664.00" y="203" font-size="16">8,000 / -20%</text>
<text x="36" y="267" font-size="16">50% candidates removed</text>
<rect x="265" y="244" width="288.00" height="34" rx="5" fill="#60a5fa"/>
<text x="568.00" y="267" font-size="16">6,000 / -40%</text>
<text x="36" y="331" font-size="16">75% candidates removed</text>
<rect x="265" y="308" width="192.00" height="34" rx="5" fill="#34d399"/>
<text x="472.00" y="331" font-size="16">4,000 / -60%</text>
<text x="36" y="365" font-size="15" fill="#b9c6d8">Assumes selection happens before the provider call, with no added prompt overhead.</text>
<text x="36" y="391" font-size="15" fill="#b9c6d8">Excludes output tokens, cache pricing, local compute, retries, and quality effects.</text>
</g></svg>
